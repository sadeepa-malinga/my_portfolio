<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadeepa Malinga | Chemical & Process Engineer | Data Analyst</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS for the Rotating Neon Ring -->
    <style>
        @keyframes rotate {
            0% { --border-angle: 0deg; }
            100% { --border-angle: 360deg; }
        }
        @property --border-angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }
        .neon-border {
            position: relative;
        }
        .neon-border::before {
            content: "";
            position: absolute;
            inset: -4px;
            z-index: -1;
            border-radius: 50%;
            padding: 4px;
            background: conic-gradient(
                from var(--border-angle),
                #06b6d4,
                #38bdf8,
                #9333ea,
                #ec4899,
                #06b6d4
            );
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotate 4s linear infinite;
            filter: blur(2px);
        }
        /* Loading state */
        .loading-skeleton {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans leading-relaxed">

    <!-- Header / Navbar -->
    <header class="fixed top-0 left-0 w-full bg-slate-950/80 backdrop-blur-md z-50 border-b border-slate-800">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3 group">
                <div class="relative w-9 h-9 rounded-full border border-cyan-500/50 shadow-inner shadow-cyan-500/20 overflow-hidden">
                    <img id="nav-photo" src="" alt="" class="w-full h-full object-cover transition-transform group-hover:scale-110">
                </div>
                <span id="nav-name" class="text-lg font-bold tracking-tight text-slate-100 group-hover:text-cyan-400 transition"></span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="#about" class="hover:text-cyan-400 transition">About</a>
                <a href="#skills" class="hover:text-cyan-400 transition">Skills</a>
                <a href="#projects" class="hover:text-cyan-400 transition">Projects</a>
                <a href="#contact" class="hover:text-cyan-400 transition">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="hero" class="min-h-screen flex items-center justify-center pt-20 pb-24 px-6">
        <div class="max-w-6xl mx-auto flex flex-col-reverse md:flex-row items-center justify-between gap-12 md:gap-24">
            <div class="flex-1 text-center md:text-left space-y-6">
                <span id="hero-badge" class="inline-block px-4 py-1.5 text-xs font-bold uppercase tracking-wider bg-cyan-950/50 text-cyan-400 rounded-full border border-cyan-800/50 shadow-inner shadow-cyan-950"></span>
                <h1 class="text-4xl sm:text-5xl md:text-7xl font-extrabold text-white tracking-tighter leading-[1.1]">
                    <span id="hero-title1"></span><br>
                    <span id="hero-title2" class="bg-gradient-to-r from-cyan-300 via-cyan-500 to-blue-500 bg-clip-text text-transparent"></span>
                </h1>
                <p id="hero-desc" class="text-lg sm:text-xl text-slate-400 max-w-2xl mx-auto md:mx-0"></p>
                <div class="flex flex-wrap items-center justify-center md:justify-start gap-4 pt-4">
                    <a href="#projects" class="px-8 py-4 bg-cyan-500 text-slate-950 font-semibold rounded-lg hover:bg-cyan-400 transition-all duration-300 shadow-lg shadow-cyan-950/40 hover:-translate-y-0.5">
                        View Projects
                    </a>
                    <a id="hero-linkedin" href="#" target="_blank" class="px-8 py-4 bg-slate-800 border border-slate-700 font-semibold rounded-lg hover:bg-slate-700 transition-all duration-300 text-slate-100 flex items-center gap-2.5">
                        <i class="fab fa-linkedin text-sky-400"></i>
                        LinkedIn
                    </a>
                </div>
            </div>
            <div class="flex-none flex justify-center">
                <div class="relative w-64 h-64 md:w-80 md:h-80 neon-border">
                    <img id="hero-photo" src="" alt="" class="rounded-full object-cover w-full h-full border-4 border-slate-950 shadow-2xl shadow-black/50">
                </div>
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="py-24 px-6 bg-slate-900/50 border-t border-slate-900">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-3xl md:text-4xl font-bold tracking-tight mb-8 text-slate-100">About Me</h2>
            <div id="about-content" class="prose prose-lg prose-invert max-w-none text-slate-300 space-y-6">
                <!-- filled by JS -->
            </div>
        </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="py-24 px-6 border-t border-slate-900">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-3xl md:text-4xl font-bold tracking-tight mb-12 text-slate-100">Core Competencies</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <!-- Process Engineering -->
                <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-xl">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 rounded-xl bg-cyan-950 flex items-center justify-center text-cyan-400 text-2xl border border-cyan-800">
                            <i class="fa-solid fa-industry"></i>
                        </div>
                        <h3 class="text-2xl font-semibold text-cyan-400">Process Engineering</h3>
                    </div>
                    <div id="skills-process" class="flex flex-wrap gap-3">
                        <!-- filled by JS -->
                    </div>
                </div>
                <!-- Data & Tech -->
                <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-xl">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-12 h-12 rounded-xl bg-blue-950/50 flex items-center justify-center text-blue-400 text-2xl border border-blue-900/50">
                            <i class="fa-solid fa-code-branch"></i>
                        </div>
                        <h3 class="text-2xl font-semibold text-blue-400">Data & Tech Stack</h3>
                    </div>
                    <div id="skills-data" class="flex flex-wrap gap-3">
                        <!-- filled by JS -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="py-24 px-6 bg-slate-900/50 border-t border-slate-900">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-3xl md:text-4xl font-bold tracking-tight mb-12 text-slate-100">Featured Projects</h2>
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- filled by JS -->
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="py-24 px-6 border-t border-slate-900">
        <div class="max-w-4xl mx-auto text-center">
            <h2 id="contact-heading" class="text-3xl font-bold tracking-tight mb-4 text-slate-100"></h2>
            <p id="contact-text" class="text-slate-400 mb-8 max-w-xl mx-auto"></p>
            <a id="contact-email" href="#" class="inline-block px-8 py-4 bg-cyan-500 text-slate-950 font-semibold rounded-lg hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/20">
                Send Me an Email
            </a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-8 border-t border-slate-900 text-center text-sm text-slate-500 bg-slate-950">
        <p id="footer-text"></p>
    </footer>

    <script>
        // Load content from JSON and render the page
        async function loadContent() {
            try {
                const res = await fetch('content.json?t=' + Date.now());
                if (!res.ok) throw new Error('Failed to load content.json');
                const data = await res.json();
                renderPage(data);
            } catch (err) {
                console.error(err);
                document.body.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center text-center p-8">
                        <div>
                            <h1 class="text-2xl font-bold text-red-400 mb-4">Content load failed</h1>
                            <p class="text-slate-400">Make sure content.json exists in the same folder as index.html</p>
                        </div>
                    </div>`;
            }
        }

        function renderPage(data) {
            // Site / Nav
            document.title = data.site.title || document.title;
            document.getElementById('nav-name').textContent = data.site.name;
            document.getElementById('nav-photo').src = data.site.photo;
            document.getElementById('nav-photo').alt = data.site.name;

            // Hero
            document.getElementById('hero-badge').textContent = data.hero.badge;
            document.getElementById('hero-title1').textContent = data.hero.title_line1;
            document.getElementById('hero-title2').textContent = data.hero.title_line2;
            document.getElementById('hero-desc').textContent = data.hero.description;
            document.getElementById('hero-linkedin').href = data.hero.linkedin_url;
            document.getElementById('hero-photo').src = data.site.photo;
            document.getElementById('hero-photo').alt = data.site.name;

            // About
            const aboutEl = document.getElementById('about-content');
            aboutEl.innerHTML = `
                <p>${data.about.paragraph1}</p>
                <p>${data.about.paragraph2}</p>
            `;

            // Skills - Process
            const processEl = document.getElementById('skills-process');
            processEl.innerHTML = (data.skills.process_engineering || []).map(skill =>
                `<span class="px-4 py-2 bg-slate-800 text-slate-300 rounded-full border border-slate-700">${skill}</span>`
            ).join('');

            // Skills - Data
            const dataEl = document.getElementById('skills-data');
            dataEl.innerHTML = (data.skills.data_tech || []).map(skill =>
                `<span class="px-4 py-2 bg-slate-800 text-slate-300 rounded-full border border-slate-700">${skill}</span>`
            ).join('');

            // Projects
            const projectsEl = document.getElementById('projects-grid');
            projectsEl.innerHTML = (data.projects || []).map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 flex flex-col hover:border-cyan-500/50 transition-all shadow-xl">
                    <div class="flex items-center justify-between mb-5">
                        <i class="fa-regular fa-folder-open text-3xl text-cyan-400"></i>
                        <a href="${p.github_url || '#'}" target="_blank" class="text-slate-400 hover:text-cyan-400">
                            <i class="fab fa-github text-xl"></i>
                        </a>
                    </div>
                    <h3 class="text-xl font-semibold text-slate-100 mb-3">${p.title}</h3>
                    <p class="text-slate-400 text-sm mb-6 flex-grow">${p.description}</p>
                    <div class="flex flex-wrap gap-2 pt-4 border-t border-slate-800">
                        ${(p.tags || []).map(t => `<span class="text-xs px-3 py-1 bg-cyan-950 text-cyan-400 rounded-full">${t}</span>`).join('')}
                    </div>
                </div>
            `).join('');

            // Contact
            document.getElementById('contact-heading').textContent = data.contact.heading;
            document.getElementById('contact-text').textContent = data.contact.text;
            const emailLink = document.getElementById('contact-email');
            emailLink.href = `mailto:${data.contact.email}`;

            // Footer
            document.getElementById('footer-text').innerHTML = `&copy; ${data.footer.year} ${data.footer.text}`;
        }

        // Start
        loadContent();
    </script>
</body>
</html>
